name: 📦 Sync APT/YUM repository

on:
  # Low-latency trigger fired by the monorepo after a CLI release publishes.
  repository_dispatch:
    types: [new-release]

  # Manual trigger with optional flags for full sync and single-release reindex.
  workflow_dispatch:
    inputs:
      force:
        description: '🧨 Wipe and rebuild the entire index from scratch'
        type: boolean
        default: false
      version:
        description: '🎯 Reindex a single release tag (e.g. v0.5.2). Leave blank for incremental sync.'
        type: string
        required: false

  # Drift catcher — fills any gaps if a previous run failed silently.
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: linux-packages-sync
  cancel-in-progress: false

# pkgs.galtea.ai is served by CloudFront from the bucket, which is the only
# copy of the repository. The variables come from the platform `pkgs` unit.
env:
  MONOREPO: Galtea-AI/monorepo
  APT_DISTRIBUTION: stable
  AWS_REGION: eu-west-1
  PKGS_S3_BUCKET: ${{ vars.PKGS_S3_BUCKET }}

jobs:
  sync:
    name: 🔄 Sync index
    runs-on: ubuntu-latest
    # No `environment:`: the publish role trusts only the OIDC subject of main.
    steps:
      - name: 📥 Checkout linux-packages
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: ☁️  Sign in to AWS
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7  # v6.0.0
        with:
          role-to-assume: ${{ vars.PKGS_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 📥 Read the ingested-tags manifest from S3
        id: manifest
        run: |
          set -euo pipefail
          # The packages in git are not the published repository; the bucket is.
          rm -rf apt yum .ingested-tags
          if aws s3 cp "s3://$PKGS_S3_BUCKET/.ingested-tags" .ingested-tags --only-show-errors; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "  • $(wc -l < .ingested-tags | tr -d ' ') tag(s) already in s3://$PKGS_S3_BUCKET"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "  • s3://$PKGS_S3_BUCKET has no .ingested-tags yet"
          fi

      - name: 🛎️  Trigger context
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          DISPATCH_TYPE: ${{ github.event.action }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          echo "::group::🛎️  Why am I running?"
          echo "  • Event:     $EVENT"
          echo "  • Actor:     $ACTOR"
          if [ "$EVENT" = "repository_dispatch" ]; then
            echo "  • Dispatch:  $DISPATCH_TYPE  (likely a fresh CLI release on the monorepo)"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "  • Inputs:    force=${INPUT_FORCE:-false}  version=${INPUT_VERSION:-<none>}"
          elif [ "$EVENT" = "schedule" ]; then
            echo "  • Schedule:  daily drift catcher"
          fi
          echo "::endgroup::"

      - name: 🛠️  Install indexing tools
        run: |
          echo "::group::🛠️  Installing apt-ftparchive / createrepo_c / rpm / gnupg"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c rpm gnupg
          echo ""
          echo "  • apt-ftparchive: $(apt-ftparchive --version 2>&1 | head -1)"
          echo "  • createrepo_c:  $(createrepo_c --version 2>&1 | head -1)"
          echo "  • rpmsign:       $(rpmsign --version 2>&1 | head -1)"
          echo "  • gpg:           $(gpg --version | head -1)"
          echo "::endgroup::"

      - name: 🔑 Import GPG signing key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd  # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          trust_level: 5

      - name: ⚙️  Configure rpm macros for non-interactive signing
        env:
          GPG_NAME: ${{ steps.import-gpg.outputs.email }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # rpmsign shells out to gpg via the %__gpg_sign_cmd macro. The
          # default macro doesn't pass the passphrase, so signing fails
          # in CI (no TTY for pinentry). We override the command to use
          # --pinentry-mode loopback + --passphrase, mirroring how the
          # rest of the workflow signs Release / repomd.xml.
          cat > ~/.rpmmacros <<MACROS
          %_signature gpg
          %_gpg_name $GPG_NAME
          %__gpg_sign_cmd %{__gpg} gpg --batch --no-armor --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --no-secmem-warning -u "%{_gpg_name}" -sbo %{__signature_filename} --digest-algo sha256 %{__plaintext_filename}
          MACROS

      - name: 🎯 Determine target releases
        id: targets
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_READ_TOKEN }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          VERSION: ${{ github.event.inputs.version || '' }}
          MANIFEST_FOUND: ${{ steps.manifest.outputs.found }}
        run: |
          set -euo pipefail

          # Without a manifest an incremental run would upload every release,
          # so the first fill stays an explicit force run.
          if [ "$FORCE" != "true" ] && [ "$MANIFEST_FOUND" != "true" ]; then
            echo "::error::s3://$PKGS_S3_BUCKET has no .ingested-tags. Fill the bucket with a force run first."
            exit 1
          fi

          echo "::group::📡 Listing CLI releases on $MONOREPO"
          # Note: GoReleaser's nfpms uses different separator conventions per format —
          # .deb files are named galtea_VERSION_ARCH.deb (underscore, Debian convention)
          # .rpm files are named galtea-VERSION-RELEASE.ARCH.rpm (dash, RPM convention).
          # Match both with `galtea[-_]`.
          #
          # Use the raw releases API (`gh api`) instead of `gh release list --json`
          # — the latter doesn't expose the `assets` field in its JSON projection,
          # so we'd be unable to filter by asset name.
          ALL_RELEASES=$(gh api "repos/$MONOREPO/releases?per_page=100" --paginate \
            | jq -r '[.[] | select(.assets[]?.name | test("^galtea[-_].*\\.(deb|rpm)$")) | .tag_name] | unique | .[]' \
            | sort -V \
            || true)
          ALL_COUNT=$(echo "$ALL_RELEASES" | grep -c . || true)
          echo "  • Found $ALL_COUNT release(s) carrying galtea_*.deb / .rpm assets"
          if [ "$ALL_COUNT" -gt 0 ]; then
            echo "$ALL_RELEASES" | sed 's/^/      /'
          fi
          echo "::endgroup::"

          if [ "$FORCE" = "true" ]; then
            MODE="force"
            EMOJI="🧨"
            REASON="full rebuild — wiping existing index and reindexing every release"
            TARGETS="$ALL_RELEASES"
          elif [ -n "$VERSION" ]; then
            MODE="version"
            EMOJI="🎯"
            REASON="single-release reindex"
            TARGETS="$VERSION"
          else
            MODE="incremental"
            EMOJI="➕"
            REASON="incremental sync — adding only releases missing from the index"
            TARGETS=""
            # Source of truth = .ingested-tags (manifest stored in the bucket).
            # We previously inferred filenames from the tag name, but goreleaser's
            # snapshot builds bake a "next" version into the artifact name that
            # bears no relation to the tag, so the filename glob never matched
            # and incremental runs re-ingested every release on every run.
            for tag in $ALL_RELEASES; do
              if ! grep -qxF "$tag" .ingested-tags 2>/dev/null; then
                TARGETS="$TARGETS $tag"
              fi
            done
          fi

          # Trim leading/trailing whitespace.
          TARGETS=$(echo "$TARGETS" | xargs || true)
          TARGET_COUNT=$(echo "$TARGETS" | wc -w | tr -d ' ')

          {
            echo "mode=$MODE"
            echo "emoji=$EMOJI"
            echo "targets=$TARGETS"
            echo "target_count=$TARGET_COUNT"
          } >> "$GITHUB_OUTPUT"

          echo "::group::$EMOJI Plan"
          echo "  • Mode:    $MODE"
          echo "  • Reason:  $REASON"
          echo "  • Targets: $TARGET_COUNT release(s)"
          if [ "$TARGET_COUNT" -gt 0 ]; then
            echo "$TARGETS" | tr ' ' '\n' | sed 's/^/      /'
          else
            echo "      (nothing to do — index is already in sync)"
          fi
          echo "::endgroup::"

      # A force run starts from an empty tree; the upload's --delete then
      # removes from the bucket every file this run did not rebuild.
      - name: 🧹 Force mode — start from an empty index
        if: steps.targets.outputs.mode == 'force'
        run: rm -f .ingested-tags

      - name: ⬇️  Download the current repository from S3
        if: steps.targets.outputs.targets != '' && steps.targets.outputs.mode != 'force'
        run: |
          set -euo pipefail
          echo "::group::⬇️  aws s3 sync s3://$PKGS_S3_BUCKET → apt/ yum/"
          aws s3 sync "s3://$PKGS_S3_BUCKET/apt" apt --only-show-errors
          aws s3 sync "s3://$PKGS_S3_BUCKET/yum" yum --only-show-errors
          echo "  • $(find apt/pool -name '*.deb' 2>/dev/null | wc -l | tr -d ' ') .deb, $(find yum -maxdepth 1 -name '*.rpm' 2>/dev/null | wc -l | tr -d ' ') .rpm"
          echo "::endgroup::"

      - name: ⬇️  Download and ingest target releases
        if: steps.targets.outputs.targets != ''
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_READ_TOKEN }}
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          set -euo pipefail
          mkdir -p staging
          TOTAL_DEB=0
          TOTAL_RPM=0

          for tag in $TARGETS; do
            echo "::group::📦 $tag"
            mkdir -p "staging/$tag"

            echo "  ⬇️  Downloading assets from $MONOREPO@$tag …"
            gh release download "$tag" -R "$MONOREPO" \
              --pattern 'galtea_*.deb' \
              --pattern 'galtea-*.rpm' \
              --dir "staging/$tag" \
              --clobber
            DEB_COUNT=$(find "staging/$tag" -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ')
            RPM_COUNT=$(find "staging/$tag" -maxdepth 1 -name '*.rpm' | wc -l | tr -d ' ')
            echo "  ✔  Downloaded: $DEB_COUNT .deb, $RPM_COUNT .rpm"

            echo "  🗂️  Copying .deb into apt/pool/ …"
            mkdir -p apt/pool/main/g/galtea
            for deb in staging/"$tag"/*.deb; do
              [ -e "$deb" ] || continue
              cp -f "$deb" apt/pool/main/g/galtea/
              echo "      + $(basename "$deb")"
            done

            echo "  🗂️  Copying .rpm into yum/ …"
            mkdir -p yum
            for rpm in staging/"$tag"/*.rpm; do
              [ -e "$rpm" ] || continue
              cp -f "$rpm" yum/
              echo "      + $(basename "$rpm")"
            done

            TOTAL_DEB=$((TOTAL_DEB + DEB_COUNT))
            TOTAL_RPM=$((TOTAL_RPM + RPM_COUNT))
            echo "::endgroup::"
          done

          echo "ingested_deb=$TOTAL_DEB" >> "$GITHUB_OUTPUT"
          echo "ingested_rpm=$TOTAL_RPM" >> "$GITHUB_OUTPUT"
          echo ""
          echo "🎉 Ingested $TOTAL_DEB .deb and $TOTAL_RPM .rpm across $(echo $TARGETS | wc -w) release(s)"

      # apt-ftparchive, not reprepro: reprepro 5.3 keeps one version per
      # package, and every Debian and Ubuntu release ships 5.3. Each run
      # indexes every .deb in the pool, so every released version stays
      # installable with `apt install galtea=<version>`.
      - name: 🔏 Regenerate APT index and sign Release
        if: steps.targets.outputs.targets != ''
        run: |
          set -euo pipefail
          echo "::group::🔏 apt-ftparchive + gpg on apt/dists/$APT_DISTRIBUTION"
          cd apt
          rm -rf dists
          for arch in amd64 arm64; do
            mkdir -p "dists/$APT_DISTRIBUTION/main/binary-$arch"
            apt-ftparchive --arch "$arch" packages pool > "dists/$APT_DISTRIBUTION/main/binary-$arch/Packages"
            gzip -9nkf "dists/$APT_DISTRIBUTION/main/binary-$arch/Packages"
          done
          # Written outside dists/ first: apt-ftparchive hashes every file it finds there.
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Galtea \
            -o "APT::FTPArchive::Release::Label=Galtea CLI" \
            -o "APT::FTPArchive::Release::Suite=$APT_DISTRIBUTION" \
            -o "APT::FTPArchive::Release::Codename=$APT_DISTRIBUTION" \
            -o "APT::FTPArchive::Release::Architectures=amd64 arm64" \
            -o APT::FTPArchive::Release::Components=main \
            -o "APT::FTPArchive::Release::Description=Galtea CLI APT repository" \
            release "dists/$APT_DISTRIBUTION" > ../staging/Release
          mv ../staging/Release "dists/$APT_DISTRIBUTION/Release"
          gpg --batch --yes --clearsign -o "dists/$APT_DISTRIBUTION/InRelease" "dists/$APT_DISTRIBUTION/Release"
          gpg --batch --yes --detach-sign --armor -o "dists/$APT_DISTRIBUTION/Release.gpg" "dists/$APT_DISTRIBUTION/Release"
          echo "  ✔  APT index regenerated and signed"
          grep -h '^Version' dists/"$APT_DISTRIBUTION"/main/binary-amd64/Packages | sed 's/^/      /'
          echo "::endgroup::"

      - name: 🔏 Sign .rpm packages
        if: steps.targets.outputs.targets != ''
        run: |
          set -euo pipefail
          echo "::group::🔏 rpmsign --addsign on the .rpm files this run ingested"
          # DNF with gpgcheck=1 validates BOTH the repodata signature
          # (repomd.xml.asc) AND the embedded signature inside each .rpm.
          # GoReleaser's nfpms produces unsigned .rpm files, so we sign
          # them here with the same release-signing key. Only new files:
          # re-signing changes the bytes, so the upload would resend every .rpm.
          shopt -s nullglob
          for rpm in staging/*/*.rpm; do
            rpmsign --addsign "yum/$(basename "$rpm")"
            echo "  ✔  $(basename "$rpm")"
          done
          echo "::endgroup::"

      - name: 🔏 Regenerate YUM metadata and sign repodata
        if: steps.targets.outputs.targets != ''
        run: |
          set -euo pipefail
          echo "::group::🔏 createrepo_c + gpg --detach-sign on yum/repodata/repomd.xml"
          createrepo_c --update yum/
          rm -f yum/repodata/repomd.xml.asc
          gpg --batch --yes --detach-sign --armor yum/repodata/repomd.xml
          echo "  ✔  YUM metadata regenerated and signed"
          ls -la yum/repodata/ | sed 's/^/      /'
          echo "::endgroup::"

      - name: 📝 Update ingested-tags manifest
        if: steps.targets.outputs.targets != ''
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          set -euo pipefail
          # Append the tags we just ingested to .ingested-tags. Sorted &
          # de-duplicated so the file remains a stable source of truth
          # for the next incremental run.
          touch .ingested-tags
          for tag in $TARGETS; do
            echo "$tag"
          done >> .ingested-tags
          sort -uV -o .ingested-tags .ingested-tags
          echo "::group::📝 .ingested-tags now contains"
          sed 's/^/      /' .ingested-tags
          echo "::endgroup::"

      # Order matters: packages before the indexes that name them, stale
      # packages removed only after the indexes stop naming them, and the
      # manifest last so a failed run is retried by the next one.
      - name: 🚀 Upload to S3
        id: upload
        if: steps.targets.outputs.targets != ''
        run: |
          set -euo pipefail
          BUCKET="s3://$PKGS_S3_BUCKET"
          echo "::group::🚀 aws s3 sync → $BUCKET"
          aws s3 sync apt/pool "$BUCKET/apt/pool" --only-show-errors
          aws s3 sync yum "$BUCKET/yum" --exclude 'repodata/*' --only-show-errors
          aws s3 sync apt/dists "$BUCKET/apt/dists" --delete --only-show-errors
          aws s3 sync yum/repodata "$BUCKET/yum/repodata" --delete --only-show-errors
          aws s3 sync apt/pool "$BUCKET/apt/pool" --delete --only-show-errors
          aws s3 sync yum "$BUCKET/yum" --exclude 'repodata/*' --delete --only-show-errors
          for file in index.html public.key favicon.svg; do
            aws s3 cp "$file" "$BUCKET/$file" --only-show-errors
          done
          aws s3 cp .ingested-tags "$BUCKET/.ingested-tags" --only-show-errors
          echo "  ✔  Uploaded; CloudFront serves the new indexes within 60 s"
          echo "::endgroup::"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: 🏁 Run summary
        if: always()
        env:
          MODE: ${{ steps.targets.outputs.mode }}
          EMOJI: ${{ steps.targets.outputs.emoji }}
          TARGET_COUNT: ${{ steps.targets.outputs.target_count }}
          TARGETS: ${{ steps.targets.outputs.targets }}
          UPLOADED: ${{ steps.upload.outputs.uploaded }}
        run: |
          {
            echo "## ${EMOJI:-🟰} Sync run summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Mode | \`${MODE:-no-op}\` |"
            echo "| Targets | ${TARGET_COUNT:-0} release(s) |"
            if [ -n "${TARGETS:-}" ]; then
              echo "| Tags | \`${TARGETS}\` |"
            fi
            echo "| Uploaded to S3 | ${UPLOADED:-false} |"
            echo "| Index URL | <https://pkgs.galtea.ai> |"
          } >> "$GITHUB_STEP_SUMMARY"
